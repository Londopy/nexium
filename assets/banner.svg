<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="Nexium">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f3b"/>
      <stop offset="1" stop-color="#0e2a3f"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#8b7cf6"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8ecff"/>
      <stop offset="1" stop-color="#b8c2ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="880" height="260" rx="24" fill="#0b1020"/>
  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 65 H880 M0 130 H880 M0 195 H880"/>
    <path d="M110 0 V260 M220 0 V260 M330 0 V260 M440 0 V260 M550 0 V260 M660 0 V260 M770 0 V260"/>
  </g>
  <!-- mark -->
  <g transform="translate(40 22) scale(0.84)">
    <path d="M128 14 L226 71 Q234 76 234 85 L234 171 Q234 180 226 185 L128 242 L30 185 Q22 180 22 171 L22 85 Q22 76 30 71 Z" fill="url(#bg)"/>
    <path d="M128 30 L212 79 L212 177 L128 226 L44 177 L44 79 Z" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <g fill="none" stroke="url(#stroke)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M78 176 L78 82 L178 176 L178 82"/>
    </g>
    <g fill="#0b1020" stroke="url(#stroke)" stroke-width="8">
      <circle cx="78" cy="82" r="13"/>
      <circle cx="78" cy="176" r="13"/>
      <circle cx="178" cy="82" r="13"/>
      <circle cx="178" cy="176" r="13"/>
    </g>
    <g fill="#4fd1c5"><circle cx="78" cy="82" r="4"/><circle cx="178" cy="176" r="4"/></g>
    <g fill="#8b7cf6"><circle cx="78" cy="176" r="4"/><circle cx="178" cy="82" r="4"/></g>
  </g>
  <!-- wordmark -->
  <text x="300" y="128" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-2" fill="url(#text)">Nexium</text>
  <text x="304" y="176" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#8fa0c8">effects you can prove. one file, every target.</text>
  <!-- effect chips -->
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="15" font-weight="600">
    <rect x="304" y="196" width="102" height="30" rx="15" fill="#13203a" stroke="#4fd1c5" stroke-opacity="0.6"/>
    <text x="355" y="216" text-anchor="middle" fill="#4fd1c5">!allocates</text>
    <rect x="416" y="196" width="80" height="30" rx="15" fill="#13203a" stroke="#8b7cf6" stroke-opacity="0.6"/>
    <text x="456" y="216" text-anchor="middle" fill="#8b7cf6">!panics</text>
    <rect x="506" y="196" width="80" height="30" rx="15" fill="#13203a" stroke="#4fd1c5" stroke-opacity="0.6"/>
    <text x="546" y="216" text-anchor="middle" fill="#4fd1c5">!blocks</text>
    <rect x="596" y="196" width="158" height="30" rx="15" fill="#13203a" stroke="#8b7cf6" stroke-opacity="0.6"/>
    <text x="675" y="216" text-anchor="middle" fill="#8b7cf6">C · Python · Rust</text>
  </g>
</svg>
