name: CI (prose)

# The CI workflow skips a push or pull request that changes only prose and
# pictures. Main requires its checks, so this workflow answers for them on
# those changes with the same job names: the compiler's checks report
# "nothing to build", and the changelog and the links between the Markdown
# files are checked for real. GitHub's
# documented shape for a required check that a path filter would otherwise
# leave pending. The path list mirrors ci.yml's paths-ignore.

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "docs/i18n/**"
      - "topo/img/**"
      - "assets/**"
      - "linguist/**"
      - ".gitattributes"
      - "Formula/**"
      - "bucket/**"
      - "installers/winget/**"
  pull_request:
    paths:
      - "**.md"
      - "docs/i18n/**"
      - "topo/img/**"
      - "assets/**"
      - "linguist/**"
      - ".gitattributes"
      - "Formula/**"
      - "bucket/**"
      - "installers/winget/**"

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - run: echo "prose only; nothing to build"

  editors:
    name: editor support
    runs-on: ubuntu-latest
    steps:
      - run: echo "prose only; nothing to build"

  lint:
    name: lint
    # no Nexium source changed, so nothing to format; the links between the
    # Markdown files are what a prose change can break, so they are checked
    # here as in ci.yml's lint job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The links between files resolve
        run: python3 scripts/check_links.py

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate CHANGELOG.md with patchnotes
        run: |
          pip install patchnotes
          python - <<'EOF'
          import patchnotes
          cl = patchnotes.parse_file("CHANGELOG.md", strict=True)
          print("latest:", cl.latest())
          EOF
