name: CLA

# Every contributor accepts CLA.md once, by commenting the sentence the check
# asks for on their first pull request. Signatures are recorded on the
# cla-signatures branch of this repository.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/Londopy/nexium/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: Londopy,dependabot[bot]
          custom-notsigned-prcomment: "Thank you for the pull request. Before it can be merged, please read the [Contributor License Agreement](https://github.com/Londopy/nexium/blob/main/CLA.md) and accept it by commenting the sentence below. You keep your copyright; the agreement lets the project distribute your work under its license."
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have accepted the CLA."
