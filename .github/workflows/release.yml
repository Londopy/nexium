name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ZIG_VERSION: "0.14.1"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check the tag matches the compiler's version
        shell: bash
        run: |
          v=$(grep -m1 '^const VERSION' self/nx.nx | sed 's/.*"\(.*\)"/\1/')
          [ "v$v" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} does not match self/nx.nx VERSION $v"; exit 1; }

      # the compiler written in Nexium, built from the C seed with no Rust:
      # nx0 from bootstrap/nx.c, nx1 from self/, nx2 from nx1's own C
      - name: Build nx from the seed
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export NX_CC=cc; else export NX_ZIG=zig; fi
          sh bootstrap/build.sh
          mkdir -p build
          if [ "$RUNNER_OS" = Windows ]; then cp nx-out/bootstrap/nx2.exe build/nx.exe; else cp nx-out/bootstrap/nx2 build/nx && strip build/nx; fi
          ./build/nx* version

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp build/nx dist/
          cp README.md LICENSE CHANGELOG.md dist/
          cp -r examples std docs dist/
          tar -C dist -czf nx-${{ github.ref_name }}-${{ matrix.target }}.tar.gz .

      # ---- tier 2: aarch64 Linux and Windows on ARM, cross-compiled from the
      # same C with Zig; built for every release, not run in CI (docs/platforms.md)
      - name: Cross-compile for aarch64 Linux and Windows on ARM
        if: runner.os == 'Linux'
        run: |
          c=nx-out/bootstrap/nx1.c
          flags="-std=gnu11 -O2 -s -w -fno-strict-aliasing"
          mkdir -p cross/linux cross/windows
          zig cc $flags -target aarch64-linux-gnu -o cross/linux/nx "$c" -lm -lc
          zig cc $flags -target aarch64-windows-gnu -o cross/windows/nx.exe "$c" -lws2_32
          for t in linux windows; do
            rm -rf dist-cross && mkdir -p dist-cross
            cp cross/$t/nx* dist-cross/
            cp README.md LICENSE CHANGELOG.md dist-cross/
            cp -r examples std docs dist-cross/
            if [ $t = linux ]; then
              tar -C dist-cross -czf nx-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz .
            else
              (cd dist-cross && zip -qr ../nx-${{ github.ref_name }}-aarch64-pc-windows-msvc.zip .)
            fi
          done

      # ---- Windows: a portable zip and a full installer with a bundled Zig

      - name: Install Node (for the VS Code extension)
        if: runner.os == 'Windows'
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Stage the Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-win, dist-win\editors | Out-Null
          Copy-Item build/nx.exe dist-win/
          Copy-Item README.md, LICENSE, CHANGELOG.md dist-win/
          Copy-Item -Recurse examples, std, docs dist-win/
          # the Zig toolchain: the directory that holds zig.exe and lib/
          $zigExe = (zig env | ConvertFrom-Json).zig_exe
          $zigDir = Split-Path $zigExe
          Copy-Item -Recurse $zigDir dist-win\zig
          if (-not (Test-Path dist-win\zig\zig.exe)) { throw "bundled zig missing" }
          # the VS Code extension
          Push-Location editors/vscode
          npm ci
          npm run compile
          npx @vscode/vsce package -o ../../dist-win/editors/nexium.vsix
          Pop-Location
          Copy-Item dist-win/editors/nexium.vsix nexium-${{ github.ref_name }}.vsix
          # portable zip: compiler and docs only (no Zig; see the installer for that)
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/nx.exe, README.md, LICENSE, CHANGELOG.md dist/
          Copy-Item -Recurse examples, std, docs dist/
          Compress-Archive -Path dist/* -DestinationPath nx-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Build the installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install pillow
          python scripts/make_icon.py
          Copy-Item assets\icon.ico dist-win\nexium.ico
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $src = (Resolve-Path dist-win).Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "/DSourceDir=$src" installers\windows\nexium.iss
          Copy-Item installers\windows\Output\nexium-$ver-setup-x64.exe .

      - uses: actions/upload-artifact@v7
        with:
          name: nx-${{ matrix.target }}
          path: |
            nx-${{ github.ref_name }}-*
            nexium-*-setup-x64.exe
            nexium-${{ github.ref_name }}.vsix

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes and checksums
        id: notes
        run: |
          pip install patchnotes
          python scripts/release_notes.py "${{ github.ref_name }}" artifacts notes.md
          echo "title=$(cat title.txt)" >> "$GITHUB_OUTPUT"
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          files: artifacts/*
