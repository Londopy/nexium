name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          [ "v$v" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} does not match Cargo.toml version $v"; exit 1; }
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/nx dist/
          cp README.md LICENSE CHANGELOG.md dist/
          tar -C dist -czf nx-${{ github.ref_name }}-${{ matrix.target }}.tar.gz .
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/nx.exe dist/
          Copy-Item README.md, LICENSE, CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath nx-${{ github.ref_name }}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nx-${{ matrix.target }}
          path: nx-${{ github.ref_name }}-*

  vscode:
    name: vscode extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Package .vsix
        working-directory: editors/vscode
        run: |
          npm ci
          npm run compile
          npx @vscode/vsce package -o nexium-${{ github.ref_name }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: nexium-vscode
          path: editors/vscode/nexium-*.vsix

  release:
    needs: [build, vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Extract release notes with patchnotes
        run: |
          pip install patchnotes
          python - <<'EOF'
          import patchnotes
          cl = patchnotes.parse_file("CHANGELOG.md")
          tag = "${{ github.ref_name }}".lstrip("v")
          rel = cl.get_version(tag) or cl.latest()
          out = []
          by_type = {}
          for e in rel.entries:
              by_type.setdefault(str(e.change_type).split(".")[-1].title(), []).append(e.text)
          for kind, items in by_type.items():
              out.append(f"### {kind}\n")
              out.extend(f"- {t}" for t in items)
              out.append("")
          out.append("Requires [Zig](https://ziglang.org/download/) on PATH as the C compiler.")
          open("notes.md", "w").write("\n".join(out))
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: artifacts/*
