name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  ZIG_VERSION: "0.14.1"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check the tag matches the compiler's version
        shell: bash
        run: |
          v=$(grep -m1 '^const VERSION' self/nx.nx | sed 's/.*"\(.*\)"/\1/')
          [ "v$v" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} does not match self/nx.nx VERSION $v"; exit 1; }

      # the compiler written in Nexium, built from the C seed with no Rust:
      # nx0 from bootstrap/nx.c, nx1 from self/, nx2 from nx1's own C
      - name: Build nx from the seed
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export NX_CC=cc; else export NX_ZIG=zig; fi
          sh bootstrap/build.sh
          mkdir -p build
          if [ "$RUNNER_OS" = Windows ]; then cp nx-out/bootstrap/nx2.exe build/nx.exe; else cp nx-out/bootstrap/nx2 build/nx && strip build/nx; fi
          ./build/nx* version
          ./build/nx* run examples/hello.nx

      # the binary must run on every machine of its architecture, not only on
      # the runner that built it: no AVX in an x86-64 release (1.0.1 shipped
      # AVX-512 from the runner's CPU and trapped on machines without it)
      - name: The binary uses the baseline instruction set
        if: runner.os == 'Linux'
        run: |
          n=$(objdump -d build/nx | grep -c -E '%[yz]mm' || true)
          echo "AVX instructions: $n"
          [ "$n" = 0 ]
      - name: The binary uses the baseline instruction set (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { Write-Host "dumpbin not found; the check is skipped"; exit 0 }
          $n = (& $dumpbin.FullName /DISASM /NOLOGO build\nx.exe | Select-String -Pattern 'ymm|zmm').Count
          Write-Host "AVX instructions: $n"
          if ($n -ne 0) { exit 1 }

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist dist/completions
          cp build/nx dist/
          cp README.md LICENSE CHANGELOG.md dist/
          cp -r examples std docs dist/
          # the manual page and the shell completions, from the binary itself
          build/nx man > dist/nx.1
          for sh in bash zsh fish powershell; do build/nx completions $sh > "dist/completions/nx.$sh"; done
          tar -C dist -czf nx-${{ github.ref_name }}-${{ matrix.target }}.tar.gz .

      # ---- tier 2: aarch64 Linux and Windows on ARM, cross-compiled from the
      # same C with Zig; built for every release, not run in CI (docs/platforms.md)
      - name: Cross-compile for aarch64 Linux and Windows on ARM
        if: runner.os == 'Linux'
        run: |
          c=nx-out/bootstrap/nx1.c
          flags="-std=gnu11 -O2 -s -w -fno-strict-aliasing"
          mkdir -p cross/linux cross/windows
          zig cc $flags -target aarch64-linux-gnu -o cross/linux/nx "$c" -lm -lc
          zig cc $flags -target aarch64-windows-gnu -o cross/windows/nx.exe "$c" -lws2_32
          for t in linux windows; do
            rm -rf dist-cross && mkdir -p dist-cross
            cp cross/$t/nx* dist-cross/
            cp README.md LICENSE CHANGELOG.md dist-cross/
            cp -r examples std docs dist-cross/
            if [ $t = linux ]; then
              tar -C dist-cross -czf nx-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz .
            else
              (cd dist-cross && zip -qr ../nx-${{ github.ref_name }}-aarch64-pc-windows-msvc.zip .)
            fi
          done

      # ---- Windows: a portable zip and a full installer with a bundled Zig

      - name: Install Node (for the VS Code extension)
        if: runner.os == 'Windows'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Stage the Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-win, dist-win\editors | Out-Null
          Copy-Item build/nx.exe dist-win/
          Copy-Item README.md, LICENSE, CHANGELOG.md dist-win/
          Copy-Item -Recurse examples, std, docs dist-win/
          # the Zig toolchain: the directory that holds zig.exe and lib/
          $zigExe = (zig env | ConvertFrom-Json).zig_exe
          $zigDir = Split-Path $zigExe
          Copy-Item -Recurse $zigDir dist-win\zig
          if (-not (Test-Path dist-win\zig\zig.exe)) { throw "bundled zig missing" }
          # the VS Code extension
          Push-Location editors/vscode
          npm ci
          npm run compile
          # the extension carries the release's version, so each release publishes once
          $ver = "${{ github.ref_name }}".TrimStart("v")
          npx @vscode/vsce package $ver --no-update-package-json --no-git-tag-version -o ../../dist-win/editors/nexium.vsix
          Pop-Location
          Copy-Item dist-win/editors/nexium.vsix nexium-${{ github.ref_name }}.vsix
          # portable zip: compiler and docs only (no Zig; see the installer for that)
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/nx.exe, README.md, LICENSE, CHANGELOG.md dist/
          Copy-Item -Recurse examples, std, docs dist/
          New-Item -ItemType Directory -Force dist/completions | Out-Null
          build/nx.exe man | Set-Content -NoNewline -Encoding utf8 dist/nx.1
          foreach ($sh in "bash", "zsh", "fish", "powershell") { build/nx.exe completions $sh | Set-Content -NoNewline -Encoding utf8 "dist/completions/nx.$sh" }
          Compress-Archive -Path dist/* -DestinationPath nx-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Build the installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install pillow
          python scripts/make_icon.py
          Copy-Item assets\icon.ico dist-win\nexium.ico
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $src = (Resolve-Path dist-win).Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "/DSourceDir=$src" installers\windows\nexium.iss
          Copy-Item installers\windows\Output\nexium-$ver-setup-x64.exe .

      # the Chocolatey package wraps the installer just built: packed here,
      # attached to the release, pushed to chocolatey.org when the key is set
      - name: Chocolatey package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $sha = (Get-FileHash "nexium-$ver-setup-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "$sha  nexium-$ver-setup-x64.exe" | Set-Content sums-win.txt
          python scripts/packaging.py "${{ github.ref_name }}" sums-win.txt --only=chocolatey
          choco pack installers/chocolatey/nexium.nuspec --outputdirectory .
          if ($env:CHOCO_API_KEY) { choco push "nexium.$ver.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY }
          else { Write-Host "CHOCO_API_KEY is not set: the package is attached to the release, not pushed" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nx-${{ matrix.target }}
          path: |
            nx-${{ github.ref_name }}-*
            nexium-*-setup-x64.exe
            nexium-${{ github.ref_name }}.vsix
            nexium.*.nupkg

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      # the wheels and the npm packages that carry the compiler, from the
      # archives just built: attached to the release, then published below
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: The version from the tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Wheels and npm packages
        run: python scripts/pypi_npm.py "${{ github.ref_name }}" artifacts

      # Debian and RPM packages from the Linux archives, by nfpm; the amd64
      # .deb is installed here and nx run once, which is the package's test
      - name: Debian and RPM packages
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz | tar -xz nfpm
          ver="${{ steps.ver.outputs.version }}"
          for pair in "x86_64-unknown-linux-gnu:amd64" "aarch64-unknown-linux-gnu:arm64"; do
            target="${pair%%:*}"; arch="${pair##*:}"
            rm -rf "pkg-$arch" && mkdir -p "pkg-$arch"
            tar -xzf "artifacts/nx-${{ github.ref_name }}-$target.tar.gz" -C "pkg-$arch"
            for fmt in deb rpm; do
              (cd "pkg-$arch" && NX_VERSION="$ver" NX_ARCH="$arch" ../nfpm package -p "$fmt" -f ../installers/nfpm.yaml -t ../artifacts/)
            done
          done
          ls -l artifacts/*.deb artifacts/*.rpm
          sudo dpkg -i artifacts/nexium_${ver}_amd64.deb
          nx version && nx run examples/hello.nx --out-dir /tmp/nx-deb
          man -w nx && ls /usr/share/bash-completion/completions/nx

      # signed provenance for every asset: gh attestation verify <file> --owner Londopy
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            artifacts/nx-*
            artifacts/nexium-*
            artifacts/nexium_*
            artifacts/nexium.*

      - name: Release notes and checksums
        id: notes
        run: |
          pip install patchnotes segno
          python scripts/release_notes.py "${{ github.ref_name }}" artifacts notes.md
          echo "title=$(cat title.txt)" >> "$GITHUB_OUTPUT"
          cat notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          files: artifacts/*

      # pip install nexium-lang and npm install nexium-lang are the PyPI and
      # npm workflows (pypi.yml, npm.yml): each runs when this one finishes
      # and uploads what was attached above, PyPI through trusted publishing
      # and npm with the token or, once the packages exist, the same way

      # the VS Code extension on the Marketplace and on Open VSX, when the
      # publisher tokens are in the repository's secrets (editors/vscode/README.md)
      - name: Publish the VS Code extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          vsix=$(ls artifacts/nexium-*.vsix | head -n 1)
          echo "extension: $vsix"
          if [ -n "$VSCE_PAT" ]; then npx @vscode/vsce publish --packagePath "$vsix" -p "$VSCE_PAT"; else echo "VSCE_PAT is not set: not published to the Marketplace"; fi
          if [ -n "$OVSX_PAT" ]; then npx ovsx publish "$vsix" -p "$OVSX_PAT"; else echo "OVSX_PAT is not set: not published to Open VSX"; fi

      # the Homebrew formula, the Scoop manifest, the winget and the
      # Chocolatey manifests for this release, committed to main (this
      # repository is the tap and the bucket; the winget manifests are
      # submitted by hand). A protected main refuses the workflow's push: the
      # commit then waits on a branch, and the release steps land it.
      - name: Package-manager manifests
        run: |
          git fetch --depth=1 origin main
          git checkout -B main origin/main
          python scripts/packaging.py "${{ github.ref_name }}" artifacts/SHA256SUMS.txt
          git add Formula bucket installers/winget installers/chocolatey
          branch="packaging/${{ github.ref_name }}"
          if ! git -c user.name=Londopy -c user.email=Londopy@users.noreply.github.com commit -q -m "packaging: the manifests for ${{ github.ref_name }}"; then
            echo "the manifests were already current"
          elif git push origin main; then
            echo "the manifests are on main"
          else
            git push --force origin "HEAD:refs/heads/$branch"
            echo "::notice::main is protected, so the manifests wait on the branch $branch. To land them: git fetch origin $branch && git cherry-pick FETCH_HEAD && git push origin main"
          fi
