# The numbers page: bench/ in five languages on a GitHub runner, the medians
# committed to bench/results/latest.json and docs/numbers.md; Nexium's time
# as a multiple of C's in the same run growing by a quarter against the
# last run fails the job (a slower runner does not). A protected main
# refuses the workflow's push: the numbers then live on the branch
# `numbers`, the last run there is the baseline, and the site reads the
# page from there.
name: Bench

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  ZIG_VERSION: "0.14.1"

jobs:
  numbers:
    name: numbers
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the numbers branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Build nx from the seed
        run: sh bootstrap/build.sh
      - name: The last run, as the baseline
        run: |
          cp bench/results/latest.json nx-out/baseline.json
          if git fetch --depth=1 origin numbers 2>/dev/null; then
            git show FETCH_HEAD:bench/results/latest.json > nx-out/baseline.json
            echo "the baseline is the numbers branch"
          fi
      - name: Run the benchmarks
        run: |
          python bench/run.py --runs 7 --nx nx-out/bootstrap/nx2 --check nx-out/baseline.json --out bench/results/latest.json --page docs/numbers.md
      - name: Commit the numbers
        run: |
          git fetch --depth=1 origin main
          git checkout -B main origin/main
          git add bench/results/latest.json docs/numbers.md
          if ! git -c user.name=Londopy -c user.email=Londopy@users.noreply.github.com commit -q -m "bench: the numbers for $(date -u +%Y-%m-%d)"; then
            echo "the numbers did not change"
          elif git push origin main; then
            echo "the numbers are on main"
          else
            git push --force origin HEAD:refs/heads/numbers
            echo "::notice::main is protected, so the numbers live on the branch numbers, which the site reads. To land them on main: git fetch origin numbers && git cherry-pick FETCH_HEAD && git push origin main"
          fi
