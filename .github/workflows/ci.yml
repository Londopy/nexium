name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: "0.14.1"

jobs:
  test:
    name: test (${{ matrix.os }})
    # `nx` from source with no Rust toolchain: the C seed, the compiler in
    # Nexium building itself to a fixed point, and every suite through it,
    # run by the harness written in Nexium (tests/run.nx).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig (the C compiler; the only toolchain nx needs)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build nx from the seed and reach the fixed point
        shell: bash
        run: sh bootstrap/build.sh

      - name: Every suite, through the harness written in Nexium
        shell: bash
        run: |
          nx=nx-out/bootstrap/nx2; [ -f "$nx.exe" ] && nx="$nx.exe"
          "$nx" run tests/run.nx

      - name: Ship the example library
        shell: bash
        run: |
          nx=nx-out/bootstrap/nx2; [ -f "$nx.exe" ] && nx="$nx.exe"
          if [ "$RUNNER_OS" = macOS ]; then export NX_CC=cc; else export NX_ZIG=zig; fi
          "$nx" ship examples/ropesim.nx

      - name: Use the shipped Rust crate
        shell: bash
        run: |
          mkdir -p nx-out/rusttest/src
          printf '[package]\nname = "rusttest"\nversion = "0.1.0"\nedition = "2021"\n[dependencies]\nropesim = { path = "../ropesim/rust" }\n' > nx-out/rusttest/Cargo.toml
          printf 'fn main() { assert_eq!(ropesim::checksum(b"hello"), 1335831723); assert!(ropesim::divide(1, 0).is_err()); println!("rust ok"); }\n' > nx-out/rusttest/src/main.rs
          (cd nx-out/rusttest && cargo run -q)

      - name: Build the Windows installer (preview, no bundled Zig)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-win | Out-Null
          Copy-Item nx-out/bootstrap/nx2.exe dist-win/nx.exe
          Copy-Item README.md, LICENSE, CHANGELOG.md dist-win/
          Copy-Item -Recurse examples, std, docs dist-win/
          pip install pillow
          python scripts/make_icon.py
          Copy-Item assets\icon.ico dist-win\nexium.ico
          $src = (Resolve-Path dist-win).Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=0.0.0" "/DSourceDir=$src" installers\windows\nexium.iss
          Get-ChildItem installers\windows\Output

      - name: Call the shipped library from Python
        shell: bash
        run: |
          python - <<'EOF'
          import sys, array, os
          sys.path.insert(0, os.path.join("nx-out", "ropesim", "python"))
          import ropesim
          assert ropesim.checksum(b"hello") == 1335831723
          pos = array.array("d", [0.1, 0.2, 0.3])
          ropesim.simulate(pos, 0.01, 10)
          try:
              ropesim.divide(1, 0)
              raise SystemExit("expected a panic")
          except ropesim.NexiumPanic as e:
              print("panic converted:", e.message)
          print("ok")
          EOF

  fuzz:
    name: fuzz
    # mutated sources through the front end and random bytes through the
    # binary pattern engine (tests/fuzz.nx); a crash is a failure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build nx from the seed
        run: sh bootstrap/build.sh
      - name: Fuzz
        run: |
          export NX_ZIG=zig
          nx-out/bootstrap/nx2 run tests/fuzz.nx -- --iterations 1500 --seed ${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-findings
          path: nx-out/fuzz/findings/

  rust:
    name: the frozen Rust crate builds
    # bootstrap/rust/ still compiles until it is deleted at 1.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - run: cargo test --locked

  editors:
    name: editor support
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Compile the VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run compile
      - name: Grammars parse
        run: |
          python3 -c "import json; json.load(open('editors/vscode/syntaxes/nexium.tmLanguage.json')); json.load(open('editors/vscode/package.json')); json.load(open('editors/vscode/language-configuration.json'))"
          pip install pyyaml
          python3 -c "import yaml; yaml.safe_load(open('editors/sublime/Nexium.sublime-syntax')); yaml.safe_load(open('.github/actions/setup-nexium/action.yml')); yaml.safe_load(open('docs/templates/release-nexium-program.yml'))"
      - name: tree-sitter grammar is current and parses every source
        working-directory: editors/tree-sitter-nexium
        run: |
          npx --yes tree-sitter-cli@0.27 generate
          git diff --exit-code -- src/grammar.json src/node-types.json src/parser.c || (echo "run tree-sitter generate and commit src/"; exit 1)
          npx --yes tree-sitter-cli@0.27 parse ../../examples/*.nx ../../std/*.nx ../../gui/*.nx ../../self/*.nx --quiet --stat | tee parse.txt
          grep -q "failed parses: 0;" parse.txt
          npx --yes tree-sitter-cli@0.27 query queries/highlights.scm ../../examples/tour.nx > /dev/null

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings -A clippy::all

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate CHANGELOG.md with patchnotes
        run: |
          pip install patchnotes
          python - <<'EOF'
          import patchnotes
          cl = patchnotes.parse_file("CHANGELOG.md", strict=True)
          print("latest:", cl.latest())
          EOF
