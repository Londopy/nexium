# The compiler images on ghcr.io: ghcr.io/londopy/nexium (Debian) and
# ghcr.io/londopy/nexium:alpine, for amd64 and arm64, built from the
# release's seed at each tag. CI (ci.yml) builds both for amd64 without
# publishing on every push, and runs hello inside.
name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The version from the tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Debian
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/londopy/nexium:${{ steps.ver.outputs.version }}
            ghcr.io/londopy/nexium:latest
            ghcr.io/londopy/nexium:${{ steps.ver.outputs.version }}-debian
            ghcr.io/londopy/nexium:debian
      - name: Alpine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.alpine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/londopy/nexium:${{ steps.ver.outputs.version }}-alpine
            ghcr.io/londopy/nexium:alpine
