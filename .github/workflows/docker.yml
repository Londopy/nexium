# The compiler images on ghcr.io: ghcr.io/londopy/nexium (Debian) and
# ghcr.io/londopy/nexium:alpine, for amd64 and arm64, built from the
# release's seed at each tag. CI (ci.yml) builds both for amd64 without
# publishing on every push, and runs hello inside.
name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushes the images to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The version from the tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Debian
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/londopy/nexium:${{ steps.ver.outputs.version }}
            ghcr.io/londopy/nexium:latest
            ghcr.io/londopy/nexium:${{ steps.ver.outputs.version }}-debian
            ghcr.io/londopy/nexium:debian
      - name: Alpine
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.alpine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/londopy/nexium:${{ steps.ver.outputs.version }}-alpine
            ghcr.io/londopy/nexium:alpine
