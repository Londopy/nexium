name: Extension

# The VS Code extension of a release (the .vsix the Release workflow
# attached) published to Open VSX and to the Visual Studio Marketplace with
# the tokens in OVSX_PAT and VSCE_PAT (editors/vscode/README.md). It runs
# when the Release workflow finishes for a tag, and by hand for a tag whose
# release already exists: the first publish after a token arrives, or a
# retry. A registry without a token is skipped, not failed.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag whose extension to publish (v1.3.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: publish the extension
    # a Release run that failed, or one for a branch rather than a tag, publishes nothing
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: The tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: The extension of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" --pattern '*.vsix' --dir dist
          ls -l dist
      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          vsix=$(ls dist/*.vsix | head -n 1)
          if [ -n "$OVSX_PAT" ]; then npx ovsx publish "$vsix" -p "$OVSX_PAT"; else echo "OVSX_PAT is not set: not published to Open VSX"; fi
          if [ -n "$VSCE_PAT" ]; then npx @vscode/vsce publish --packagePath "$vsix" -p "$VSCE_PAT"; else echo "VSCE_PAT is not set: not published to the Marketplace"; fi
