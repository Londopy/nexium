name: Pages

# The documentation site, built by site/build.nx (a Nexium program) from the
# Markdown in the repository and published to GitHub Pages on every push to
# main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.14.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build nx from the seed
        run: sh bootstrap/build.sh
      # the numbers page from the Bench workflow's branch, where the numbers
      # live when a protected main refused the workflow's commit
      - name: The latest numbers
        run: |
          if git fetch --depth=1 origin numbers 2>/dev/null; then
            git checkout FETCH_HEAD -- docs/numbers.md bench/results/latest.json
            echo "the numbers page is the numbers branch's"
          fi
      - name: Build the site
        run: |
          export NX_ZIG=zig
          nx-out/bootstrap/nx2 run site/build.nx
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
