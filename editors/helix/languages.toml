# Nexium for Helix. Append to ~/.config/helix/languages.toml (see README.md).

[[language]]
name = "nexium"
scope = "source.nexium"
injection-regex = "^nexium$"
file-types = ["nx"]
roots = ["nexium.toml"]
comment-tokens = ["//", "///", "//!"]
indent = { tab-width = 4, unit = "    " }
language-servers = ["nexium"]

[language.auto-pairs]
'(' = ')'
'[' = ']'
'{' = '}'
'"' = '"'

[language-server.nexium]
command = "nx"
args = ["lsp"]

[[grammar]]
name = "nexium"
# a commit with the 1.3.0 grammar (`bench` blocks); any later commit of main works too
source = { git = "https://github.com/Londopy/nexium", rev = "5ed20dc9329be2274e604dcebf3b7e678bd1b2c9", subpath = "editors/tree-sitter-nexium" }
