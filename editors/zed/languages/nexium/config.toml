name = "Nexium"
grammar = "nexium"
path_suffixes = ["nx"]
line_comments = ["// ", "/// ", "//! "]
autoclose_before = ";:.,=}])>"
tab_size = 4
hard_tabs = false
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
word_characters = ["_"]
